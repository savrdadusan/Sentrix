version: '3.8'

services:
  # 1. Bunka pre tvoj PHP/HTML web
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

  # 2. Bunka pre MySQL a automatický import tvojho SQL súboru
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root
    volumes:
      - mysql_data:/var/lib/mysql
      # TENTO RIADOK AUTOMATICKY NAHRÁ TVOJ SQL SÚBOR PRI ŠTARTE:
      - ./db/sentrix.sql:/docker-entrypoint-initdb.d/sentrix.sql

  # 3. Bunka pre phpMyAdmin (Grafické prostredie pre databázu)
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
