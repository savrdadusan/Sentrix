services:
  # 1. Bunka pre tvoj PHP/HTML web
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

  # 2. Bunka pre MySQL a automatický import tvojho SQL súboru
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: sentrix
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/sentrix.sql:/docker-entrypoint-initdb.d/sentrix.sql

  # 3. Bunka pre phpMyAdmin (Grafické prostredie pre databázu)
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: localhost
      PMA_USER: sentrix
      PMA_PASSWORD: 
    depends_on:
      - db

# TENTO BLOK TU MUSÍ BYŤ, ABY DOCKER VEDEL, KDE MÁ DRŽAŤ DÁTA DATABÁZY:
volumes:
  mysql_data:
